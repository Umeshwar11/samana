<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SAMANA | Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/responsive.css">

</head>

<body>

<!-- ================= REGISTER SECTION ================= -->

<section class="login-page">

    <div class="container-fluid">

        <div class="row min-vh-100">

            <!-- ================= LEFT SIDE ================= -->

            <div class="col-lg-6 login-left d-none d-lg-flex">

                <div class="overlay">

                    <div class="hero-content">

                        <h1>
                            Join the SAMANA Community
                        </h1>

                        <p>
                            Create your account to book unforgettable cultural
                            experiences, connect with local hosts, and explore
                            authentic India.
                        </p>

                    </div>

                </div>

            </div>

            <!-- ================= RIGHT SIDE ================= -->

            <div class="col-lg-6 d-flex align-items-center justify-content-center">

                <div class="login-card">

                    <h2 class="text-center mb-4">
                        Create Account
                    </h2>

                    <!-- REGISTER FORM -->

                    <form id="registerForm">

                        <!-- FULL NAME -->

                        <div class="mb-3">

                            <label for="name"
                                   class="form-label">

                                Full Name

                            </label>

                            <input
                                type="text"
                                id="name"
                                class="form-control"
                                placeholder="Enter your full name"
                                required>

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label for="email"
                                   class="form-label">

                                Email Address

                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <!-- PHONE -->

                        <div class="mb-3">

                            <label for="phone"
                                   class="form-label">

                                Phone Number

                            </label>

                            <input
                                type="tel"
                                id="phone"
                                class="form-control"
                                placeholder="Enter your phone number">

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label for="password"
                                   class="form-label">

                                Password

                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Create a password"
                                required>

                        </div>


                        <!-- CONFIRM PASSWORD -->

                        <div class="mb-3">

                            <label for="confirmPassword"
                                   class="form-label">

                                Confirm Password

                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-control"
                                placeholder="Confirm your password"
                                required>

                        </div>


                        <!-- TERMS -->

                        <div class="form-check mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="terms"
                                required>

                            <label class="form-check-label"
                                   for="terms">

                                I agree to the
                                <a href="#">
                                    Terms & Conditions
                                </a>

                            </label>

                        </div>


                        <!-- REGISTER BUTTON -->

                        <button
                            type="submit"
                            id="registerButton"
                            class="btn btn-success w-100 mb-3">

                            Register

                        </button>


                        <!-- LOGIN LINK -->

                        <div class="text-center">

                            Already have an account?

                            <a href="login.html">
                                Login
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- ================= END REGISTER ================= -->


<!-- JavaScript -->

<script src="js/script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
