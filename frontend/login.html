<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SAMANA | Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/responsive.css">

</head>

<body>

<!-- ================= LOGIN SECTION ================= -->

<section class="login-page">

    <div class="container-fluid">

        <div class="row min-vh-100">

            <!-- LEFT SIDE -->

            <div class="col-lg-6 login-left d-none d-lg-flex">

                <div class="overlay">

                    <div class="hero-content">

                        <h1>
                            Welcome Back to SAMANA
                        </h1>

                        <p>
                            Discover authentic cultural experiences,
                            festivals, homestays, weddings and unforgettable
                            journeys across India.
                        </p>

                    </div>

                </div>

            </div>


            <!-- RIGHT SIDE -->

            <div class="col-lg-6 d-flex align-items-center justify-content-center">

                <div class="login-card">

                    <h2 class="text-center mb-4">
                        Login
                    </h2>


                    <!-- LOGIN FORM -->

                    <form id="loginForm">

                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Enter your password"
                                    required>

                                <button
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    id="togglePassword">

                                    <i class="fa-solid fa-eye"></i>

                                </button>

                            </div>

                        </div>


                        <!-- REMEMBER / FORGOT -->

                        <div class="d-flex justify-content-between mb-4">

                            <div>

                                <input
                                    type="checkbox"
                                    id="rememberMe">

                                Remember Me

                            </div>

                            <a href="forgot-password.html">
                                Forgot Password?
                            </a>

                        </div>


                        <!-- LOGIN BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-success w-100 mb-3"
                            id="loginButton">

                            Login

                        </button>


                        <!-- OR -->

                        <div class="text-center">

                            <p>
                                OR
                            </p>

                        </div>


                        <!-- GOOGLE -->

                        <button
                            type="button"
                            class="btn btn-outline-danger w-100 mb-3">

                            <i class="fa-brands fa-google"></i>

                            Continue with Google

                        </button>


                        <!-- FACEBOOK -->

                        <button
                            type="button"
                            class="btn btn-outline-primary w-100">

                            <i class="fa-brands fa-facebook-f"></i>

                            Continue with Facebook

                        </button>


                        <!-- REGISTER -->

                        <div class="text-center mt-4">

                            Don't have an account?

                            <a href="register.html">
                                Register
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- ================= JAVASCRIPT ================= -->

<script src="js/toast.js"></script>

<script src="js/script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
