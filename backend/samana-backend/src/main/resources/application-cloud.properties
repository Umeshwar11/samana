spring.application.name=samana-backend

# Cloud SQL PostgreSQL Configuration
# Note: Cloud SQL instance can be accessed via Cloud Run VPC networking
spring.datasource.url=jdbc:postgresql://cloudsql/samana_db
spring.datasource.username=samana_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cloud SQL specific settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=900000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate/JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.datasource.initialization-mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.min-response-size=1024

# JWT
jwt.secret=${JWT_SECRET}

# Logging
logging.level.root=INFO
logging.level.com.samana=DEBUG
logging.level.org.springframework.security=INFO
