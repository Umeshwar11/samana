spring.application.name=samana-backend

# Neon PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://ep-hidden-dew-b3ghgixb-pooler.c-4.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require&user=neondb_owner&password=npg_HFNy13aAWUjz
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=900000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate/JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.min-response-size=1024

# JWT
jwt.secret=${JWT_SECRET}

# Logging
logging.level.root=INFO
logging.level.com.samana=DEBUG
logging.level.org.springframework.security=INFO
