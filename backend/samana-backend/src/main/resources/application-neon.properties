spring.application.name=samana-backend

# Neon PostgreSQL Connection
# Format: postgresql://user:password@hostname/database_name
# From https://neon.tech dashboard
# Note: NEON_DATABASE_URL comes as postgresql://, we need to convert to jdbc:postgresql://
# Extract just the host/user/db part from Neon URL, remove problematic parameters
spring.datasource.url=jdbc:postgresql://ep-snowy-mouse-b54utq0j-pooler.c-7.us-east-2.aws.neon.tech/samana?sslmode=require
spring.datasource.username=samana_owner
spring.datasource.password=npg_Aquvb5KX9hHz
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# Server
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:your-secret-key-min-32-chars-long}

# Logging
logging.level.root=INFO
logging.level.com.samana=DEBUG
logging.level.org.hibernate.SQL=DEBUG
