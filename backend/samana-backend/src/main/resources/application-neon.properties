spring.application.name=samana-backend

# Neon PostgreSQL Connection
# Format: postgresql://user:password@hostname/database_name
# From https://neon.tech dashboard
spring.datasource.url=${NEON_DATABASE_URL:jdbc:postgresql://neon_user:neon_password@ep-xyz.us-east-1.neon.tech/samana_db}
spring.datasource.username=${DB_USERNAME:neon_user}
spring.datasource.password=${DB_PASSWORD:neon_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# Server
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:your-secret-key-min-32-chars-long}

# Logging
logging.level.root=INFO
logging.level.com.samana=DEBUG
logging.level.org.hibernate.SQL=DEBUG
