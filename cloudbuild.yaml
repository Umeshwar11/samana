steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/samana-backend:$SHORT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/samana-backend:latest',
      '-f', 'Dockerfile',
      '.'
    ]

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/samana-backend:$SHORT_SHA']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - --filename=.
      - --image=gcr.io/$PROJECT_ID/samana-backend:$SHORT_SHA
      - --location=asia-south1
      - --output=/var/run/output

  # Step 4: Deploy Cloud Run Service
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'samana-backend'
      - '--image=gcr.io/$PROJECT_ID/samana-backend:$SHORT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--allow-unauthenticated'
      - '--set-env-vars=SPRING_PROFILES_ACTIVE=cloud'
      - '--set-secrets=JWT_SECRET=jwt-secret:latest,DB_PASSWORD=db-password:latest'
      - '--add-cloudsql-instances=$PROJECT_ID:asia-south1:samana-postgres'

images:
  - 'gcr.io/$PROJECT_ID/samana-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/samana-backend:latest'

options:
  machineType: 'N1_HIGHCPU_8'

timeout: '3600s'
